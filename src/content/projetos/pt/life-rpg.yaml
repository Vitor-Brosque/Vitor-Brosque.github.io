titulo: Life RPG
ordem: 2
frase: App em pixel art que transforma rotina e estudo num jogo, feito para ajudar nos dias difíceis.
status: aberto
statusTexto: Código aberto (MIT) · em uso no PC
statusDetalhe: Em uso no PC desde novembro de 2026. Faltam o acesso pelo iPhone, a IA com chave real e a primeira conexão real com o ChatGPT e o Claude.
papel: Projeto pessoal, do design à infraestrutura, com o código escrito com IA
periodo: "2026"
stack: [TypeScript, React 19, Vite, Dexie (IndexedDB), Zustand, Fastify 5, "SQLite (node:sqlite)", Zod 4, ts-fsrs, Vitest]
links:
  codigo: https://github.com/Vitor-Brosque/life-rpg
cartao: capa
tema: rpg
capa:
  imagem: ../../../assets/projetos/life-rpg/mapa.png
  moldura: celular
  alt: Mapa do mundo do Life RPG em pixel art, com seis territórios (vila, aldeia, acampamentos e ruínas) ligados por trilhas e um personagem no centro
emResumo: >-
  Comecei o Life RPG para me organizar e ele cresceu: hoje, na terceira versão, junta rotina, estudo e
  hábitos num jogo em pixel art, pensado para os dias difíceis, quando falta energia e não dá para
  sentir progresso. Uso no PC desde novembro de 2026. Foi feito para funcionar sem internet no celular
  e sincronizar com o PC quase em tempo real, e para conversar com o ChatGPT e o Claude, que propõem
  mudanças que eu reviso antes de aplicar. O código é aberto, com testes, e as regras do app foram
  comparadas com uma base de pesquisa de 63 fontes sobre hábitos e aprendizagem.
resumo:
  problema: >-
    Em dia bom tudo é fácil. O difícil são os dias ruins: travar na hora de começar, não sentir
    progresso e desistir.
  construi: >-
    Um app que mostra uma missão por vez, se adapta ao tipo do dia e foi feito para funcionar sem
    internet e sincronizar celular e PC.
  orgulho: >-
    Sincronização por cursor com atualização quase em tempo real, regras de domínio puras e decisões
    revisadas com uma base de pesquisa de 63 fontes.
problema: |-
  Venho tentando construir este app desde o fim de 2025, e esta já é a terceira versão. Comecei para me organizar. Depois vi que dava para juntar os estudos no mesmo lugar, e aos poucos entraram outras coisas, como os hábitos de sono. No caminho fui lendo sobre neurociência e sobre como hábitos se formam, e tentando trazer o que aprendia para o meu dia a dia.

  O que eu queria resolver não eram os dias bons. Com motivação e energia, tudo fica fácil. O difícil são os dias ruins: não sentir progresso, não entender direito o que estou fazendo, e os sentimentos que levam a procrastinar e a desistir.

  Por isso o app virou um jogo. Ele mostra uma missão por vez, com um primeiro passo pequeno, e se adapta ao tipo do dia: normal, baixa energia, recuperação ou livre. O progresso aparece no personagem e no mapa, e nada zera, nada decai e nada fica vermelho: um dia parado não apaga o que já foi feito. Para mim, ficou divertido de usar.

  Uso no PC desde novembro de 2026. O app foi feito para celular e PC desde o começo, por isso precisava funcionar sem internet e manter os dois em sincronia. O celular é o próximo passo.
rota:
  titulo: A rota de uma mudança
  paradas:
    - titulo: Você marca no celular
      curto: Grava no IndexedDB, sem esperar a rede.
      texto: >-
        A gravação vai direto para o IndexedDB do aparelho. A interface nunca espera a rede, e o app
        funciona com o servidor desligado.
      midia:
        imagem: ../../../assets/projetos/life-rpg/agora.png
        moldura: celular
        alt: Tela Agora do Life RPG, com uma missão de estudo em destaque, os botões Começar e Concluir e outra missão que também cabe agora
    - titulo: Sincronização
      curto: Envia o cursor e as mudanças.
      texto: >-
        O aparelho envia `POST /api/sync` com o seu cursor e as mudanças locais, e recebe tudo o que
        mudou desde aquele cursor.
    - titulo: Servidor
      curto: Last-write-wins e revisão global.
      texto: >-
        A API Fastify aplica as mudanças com last-write-wins (vence o `updatedAt` mais recente; em
        empate, fica a versão que chegou primeiro ao servidor) e avança a revisão global no SQLite.
    - titulo: Aviso aos aparelhos
      curto: Server-Sent Events.
      texto: Quando entra uma revisão nova, o servidor avisa os aparelhos conectados por Server-Sent Events, e cada um busca as mudanças.
      midia:
        video: /media/life-rpg/sincronizacao-celular-pc.mp4
        imagem: ../../../assets/projetos/life-rpg/sincronizacao-celular-pc.png
        proporcao: "16/9"
        moldura: nenhuma
        alt: Uma tarefa criada na tela de celular aparece na tela de PC cerca de um segundo depois, e uma missão concluída no PC muda a tela do celular
        legenda: "Demonstração com dados fictícios: dois navegadores na mesma máquina, um em tamanho de celular e outro de PC, ligados ao mesmo servidor."
    - titulo: Painel no PC
      curto: Atualiza quase em tempo real.
      texto: O Painel aberto no monitor secundário se atualiza quase em tempo real.
      midia:
        imagem: ../../../assets/projetos/life-rpg/painel.png
        alt: Painel do Life RPG no computador, com a missão atual, a linha do tempo do dia, o cronômetro de foco e o formulário de captura
funcionalidades:
  - titulo: Agora
    texto: >-
      Uma missão por vez, os blocos do dia, cronômetro opcional e captura rápida: escrever e ajustar por botões.
    midia:
      video: /media/life-rpg/completar-uma-missao.mp4
      imagem: ../../../assets/projetos/life-rpg/completar-uma-missao.png
      proporcao: "159/287"
      moldura: celular
      alt: Na tela Agora, a pessoa vê por que a missão foi sugerida, começa, conclui e ganha XP, e a próxima missão aparece, com dados fictícios
  - titulo: Revisão espaçada
    texto: >-
      Cards de código, de lacuna, com imagem e com áudio, agendados com FSRS-6 e um orçamento de
      tempo diário.
    midia:
      video: /media/life-rpg/revisao-espacada.mp4
      imagem: ../../../assets/projetos/life-rpg/revisao-espacada.png
      proporcao: "159/287"
      moldura: celular
      alt: "Sessão de revisão com cards de banco de dados: primeiro a pergunta, depois a resposta com o porquê e os quatro botões que decidem o próximo intervalo"
  - titulo: Personagem
    texto: >-
      XP pelo esforço estimado de cada tarefa, com teto para o tempo de foco e sem XP por só registrar
      dados, e atributos ligados a áreas reais da vida.
    midia:
      video: /media/life-rpg/personagem-evoluindo.mp4
      imagem: ../../../assets/projetos/life-rpg/personagem-evoluindo.png
      proporcao: "159/287"
      moldura: celular
      alt: Uma missão concluída leva a personagem fictícia Lia ao nível 8, o território de Intelecto vira vila no mapa e uma cor de roupa nova é liberada e escolhida
  - titulo: Jornadas
    texto: Um projeto vira uma jornada de missões em ordem. Só a próxima aparece no Agora, para o projeto não virar uma lista de tarefas.
    midia:
      imagem: ../../../assets/projetos/life-rpg/jornada.png
      moldura: celular
      alt: Jornada aberta com as missões em ordem, duas feitas e três por fazer, com dados inventados
arquitetura:
  titulo: Arquitetura
  texto: >-
    Tudo é gravado primeiro no aparelho. O servidor é o ponto de encontro entre os aparelhos e o
    lugar dos backups, não um requisito para usar o app.
  nos:
    - { id: app, rotulo: PWA React 19, detalhe: Zustand · service worker, col: 0, lin: 0, explicacao: "Telas em React com estado no Zustand. O service worker deixa o app instalável e disponível sem rede." }
    - { id: idb, rotulo: IndexedDB, detalhe: Dexie 4, col: 1, lin: 0, explicacao: "Tudo é gravado primeiro no aparelho. A interface nunca espera a rede." }
    - { id: api, rotulo: API Fastify 5, detalhe: POST /api/sync, col: 2, lin: 0, explicacao: "Recebe as mudanças com o cursor do aparelho e devolve o que mudou desde ele. Em conflito, vence o updatedAt mais recente." }
    - { id: sqlite, rotulo: SQLite, detalhe: "node:sqlite", col: 3, lin: 0, destaque: true, explicacao: "Banco nativo do Node 24, com uma revisão global que só cresce. Se o banco foi restaurado de um backup e o aparelho conhece revisões que ele não tem, o aparelho recomeça do zero e reenvia tudo." }
    - { id: backup, rotulo: Backup diário, detalhe: mídia por SHA-256, col: 4, lin: 0, explicacao: "O banco tem uma cópia por dia, com as 14 mais recentes guardadas. A mídia é guardada pelo hash SHA-256 e fica numa pasta-espelho com hard links, que não ocupa espaço extra e nunca é apagada." }
    - { id: sse, rotulo: SSE, detalhe: /api/stream, col: 3, lin: 1, explicacao: "Avisa os aparelhos conectados quando entra uma revisão nova, e cada um busca as mudanças." }
    - { id: painel, rotulo: Painel no PC, detalhe: atualiza ao vivo, col: 4, lin: 1, explicacao: "O Painel no monitor secundário acompanha o celular quase em tempo real." }
  faixas:
    - { de: app, para: idb }
    - { de: idb, para: api }
    - { de: api, para: sqlite }
    - { de: sqlite, para: backup }
    - { de: api, para: sse }
    - { de: sse, para: painel }
decisoes:
  - titulo: Offline-first de verdade
    resumo: >-
      O app grava tudo no próprio aparelho primeiro, então funciona sem internet e nunca fica esperando a rede.
    escolha: Tudo é gravado primeiro no IndexedDB, e a sincronização acontece depois.
    porque: >-
      Quero poder usar no celular em qualquer lugar, mesmo sem sinal. A interface nunca espera a rede,
      e o app funciona com o servidor desligado.
    deixeiDeLado: Um app só online, mais simples de escrever, mas inútil sem sinal.
  - titulo: Sincronização por cursor e last-write-wins
    resumo: >-
      Cada aparelho envia o que mudou e recebe o que os outros mudaram. Se dois mexerem na mesma coisa, vale a alteração mais recente.
    escolha: >-
      O servidor mantém uma revisão global. Cada aparelho envia as próprias mudanças e recebe o que
      mudou desde o seu cursor. Em conflito, vence o `updatedAt` mais recente (no empate, fica o que
      chegou primeiro). A exceção são as gravações de fala, que se somam.
    porque: >-
      Para um usuário só, com poucos conflitos reais, last-write-wins é previsível e fácil de testar.
      Se o servidor for restaurado de um backup e o aparelho conhecer revisões que ele não tem, o
      aparelho recomeça do zero e reenvia tudo.
    deixeiDeLado: >-
      CRDTs, que resolveriam edição simultânea sem perda, com uma complexidade que não se paga para
      uma pessoa só.
  - titulo: Regras de domínio puras
    resumo: >-
      As regras mais importantes do app ficam num pacote separado da interface e do servidor, o que deixa cada uma fácil de testar.
    escolha: >-
      Agendador do dia, XP, recorrência, revisão espaçada (FSRS), análise da rotina (planejado × executado, adiamentos e tendências), parser em português e merge ficam em `packages/shared`, sem navegador nem servidor.
    porque: As regras mais importantes viram funções puras, fáceis de testar e compartilhadas pelos dois lados.
    deixeiDeLado: Lógica espalhada nos componentes, mais rápida no começo e um pesadelo para testar depois.
  - titulo: Mídia endereçada por conteúdo
    resumo: >-
      Imagens e áudios são identificados pelo próprio conteúdo, então o mesmo arquivo nunca é guardado duas vezes, nem nos backups.
    escolha: >-
      Imagens e áudios são guardados pelo hash SHA-256, e o backup diário espelha a mídia com hard
      links.
    porque: >-
      O mesmo arquivo nunca é guardado duas vezes. O banco tem uma cópia por dia, com as 14 mais
      recentes guardadas, e a mídia fica numa pasta-espelho com hard links, que não ocupa espaço extra
      e nunca é apagada.
    deixeiDeLado: Nomes de arquivo por id, em que o mesmo arquivo poderia ser guardado duas vezes e mudar depois do backup.
  - titulo: Seguro mesmo sendo pessoal
    resumo: >-
      O servidor não é exposto direto na internet. O acesso de fora está planejado por uma rede privada com HTTPS.
    escolha: >-
      Token comparado em tempo constante e servidor que só aceita conexões da própria máquina. O acesso
      de fora está planejado pela rede privada do Tailscale, com HTTPS. A chave da IA fica só no
      servidor.
    porque: É um servidor com meus dados pessoais. Nada fica exposto direto na internet.
    deixeiDeLado: Abrir uma porta no roteador, que seria mais simples e muito mais arriscado.
  - titulo: Assistentes que propõem, eu reviso
    resumo: >-
      O ChatGPT ou o Claude se conectam ao app e mandam propostas de rotina, objetivos, treino e estudo. Nada é gravado sem eu revisar item por item.
    escolha: >-
      Um servidor MCP próprio, sem SDK, com OAuth 2.1 (PKCE, registro dinâmico de clientes, página de
      consentimento e chaves revogáveis guardadas só como hash). A proposta é validada por JSON Schema e
      pelas regras do domínio e só vale depois da minha revisão, item por item. Também funciona sem
      conector, copiando e colando num chat qualquer.
    porque: >-
      Um erro da IA vira um item desmarcado, não um dado estragado. E só uma porta vai para a internet:
      a do conector, com chaves que eu revogo quando quiser.
    deixeiDeLado: Deixar a IA gravar direto no app, mais rápido de fazer e capaz de transformar qualquer erro dela em dado errado.
  - titulo: A IA vê só o que precisa
    resumo: >-
      O que vai para o assistente é escolhido campo a campo. Diário, sono e nutrição nunca saem do aparelho.
    escolha: >-
      Uma função pura monta o contexto: entram a estrutura do app e o estudo das disciplinas (caderno,
      apostilas, cards e o texto dos PDFs da aula, entregue por página e com limite de tamanho). Diário,
      sono, nutrição e PDFs fora das disciplinas nunca entram, e testes conferem o que fica de fora.
    porque: >-
      Privacidade começa no desenho. E o caderno de cada disciplina guarda o que já foi estudado, então
      um chat novo de uma matéria continua de onde o outro parou.
    deixeiDeLado: Mandar o banco inteiro para a IA, que daria mais contexto e exporia o que ela não precisa ver.
  - titulo: Evidência antes de gamificação
    resumo: >-
      Antes de decidir o que dá pontos, revisei os fluxos principais do app à luz de pesquisas sobre hábitos e aprendizagem.
    escolha: >-
      Comparei as regras do app com uma base de pesquisa de 63 fontes sobre hábitos, aprendizagem e sono, e revisei os fluxos principais à luz dela. O resultado está [neste documento](https://github.com/Vitor-Brosque/life-rpg/blob/main/docs/analise-pesquisa-cientifica-2026-11-13.md), que cita as fontes por código.
    porque: >-
      Gamificação mal feita recompensa a coisa errada. Por isso, registrar o sono não dá XP:
      recompensar o registro, e não o comportamento, pode piorar a motivação.
    deixeiDeLado: >-
      Dar XP para tudo, que parece motivador e cria incentivo errado. XP, níveis e mapa são assumidos
      como gosto pessoal, não como técnica comprovada.
hoje: Funciona sem internet, tem cerca de 2.700 testes automáticos rodando no CI do GitHub e está em uso no PC.
proximos:
  - "Ligar o acesso HTTPS pela rede privada e testar no iPhone real: instalação como PWA, notificações, microfone, uso offline e sincronização com o PC."
  - Testar as ajudas de IA com uma chave real.
  - Fazer a primeira conexão real do ChatGPT e do Claude com o app.
seo:
  descricao: >-
    Estudo de caso do Life RPG: PWA offline-first em pixel art, com sincronização por cursor, SSE e
    regras de domínio puras em TypeScript.
