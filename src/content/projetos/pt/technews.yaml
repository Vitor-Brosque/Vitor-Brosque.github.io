emResumo: >-
  Tem portal e notícia demais, e eu me perdia nas novidades de tecnologia. O TechNews foi desenhado
  para resolver isso: reúne as notícias dos temas que eu acompanho, passa por uma IA que filtra,
  classifica e resume, e me entrega tudo numa tela para ler toda manhã. O que eu gostar, eu salvo. O
  resto sai sozinho depois de um prazo.
resumo:
  problema: >-
    Tem portal e notícia demais. Eu me perdia nas novidades de tecnologia e queria ler só o que
    importa, toda manhã.
  construi: >-
    A primeira parte do pipeline: busca no Hacker News as notícias do dia anterior sobre 10 temas,
    descarta o que vem incompleto, extrai o texto da página e grava no PostgreSQL.
  orgulho: >-
    Rodar de novo não duplica nada, uma notícia com problema não derruba as outras, e cada etapa deixa
    um log com nome de evento.
problema: |-
  Acompanhar tecnologia virou um problema de volume. São vários portais e muita notícia por dia, e eu ficava perdido, sem saber o que valia a leitura.

  O TechNews é a minha resposta, e foi desenhado assim: busca as notícias dos temas que eu acompanho, guarda no banco, passa por uma IA que filtra, classifica e resume, e me mostra o resultado numa tela, para eu ler toda manhã. O que eu gostar, eu salvo. O que eu não salvar tem prazo para ser apagado quando chegam as novas.

  Ele também é o meu laboratório de engenharia de dados: cada etapa é construída para eu entender o porquê de cada decisão.
rota:
  modo: loop
  titulo: Das fontes à leitura da manhã
  paradas:
    - titulo: Fontes
      curto: Portais e APIs dos temas que eu acompanho.
      texto: >-
        As notícias vêm de portais e APIs de tecnologia, sempre dos temas que eu acompanho. Cada fonte
        tem o seu coletor, e um fallback assume quando uma fonte falha.
    - titulo: Coleta
      curto: Notícias do dia anterior.
      texto: >-
        Cada coletor busca as notícias do dia anterior, no fuso de São Paulo. O do Hacker News consulta
        a API de busca sobre 10 temas em 4 áreas: linguagens, IA, dados e DevOps. O que vem sem título
        ou sem URL, ou repetido entre temas, é descartado e registrado no log.
      log: "WARNING | SEM_URL_OU_TITULO | ID = 46012907"
    - titulo: Extração
      curto: Texto da página original.
      texto: >-
        Baixa a página original e extrai o texto com o trafilatura. Falha no download ou na extração
        é registrada, e a notícia é pulada.
      log: "INFO | EXTRACAO_OK | ID = 46013377"
    - titulo: PostgreSQL
      curto: Grava sem duplicar.
      texto: >-
        Grava com `INSERT ... ON CONFLICT (fonte, id_externo) DO NOTHING RETURNING id`. Se não voltou
        id, era duplicada. No fim, um log diz quantas notícias foram inseridas, quantas eram
        duplicadas e quantas foram rejeitadas.
      log: "INFO | RESUMO_INGESTAO | INSERIDAS=… | DUPLICADAS=… | REJEITADAS=…"
    - titulo: IA
      curto: Filtra, classifica e resume.
      texto: >-
        As notícias guardadas no banco passam por uma IA, que filtra, classifica e resume cada uma.
    - titulo: Leitura da manhã
      curto: Salvar o que eu gostar.
      texto: >-
        O resultado aparece numa tela, para eu ler as novidades toda manhã, de forma concisa. O que eu
        gostar, eu salvo. O que eu não salvar tem prazo para ser apagado quando chegam as novas.
decisoes:
  - titulo: Idempotência no banco
    resumo: >-
      Rodar o pipeline duas vezes não duplica notícias: o próprio banco recusa a repetida e avisa que ela já existia.
    escolha: >-
      Chave única em `(fonte, id_externo)` e `INSERT ... ON CONFLICT DO NOTHING RETURNING id`.
    porque: >-
      Rodar o pipeline de novo, de propósito ou por engano, não duplica notícias. E o `RETURNING` diz,
      sem uma consulta extra, se a linha era nova ou repetida.
    deixeiDeLado: >-
      Checar se a notícia existe antes de inserir, que custa uma consulta a mais e ainda deixa uma
      janela para duplicar.
  - titulo: Uma notícia ruim não derruba o lote
    resumo: >-
      Cada notícia é gravada por conta própria. Se uma tiver problema, só ela é descartada e as outras seguem.
    escolha: >-
      Commit por notícia. Um `DataError` ou `IntegrityError` desfaz só aquela linha, que entra na
      conta das rejeitadas.
    porque: Num pipeline de ingestão, dado estranho é normal. O resto do lote precisa seguir.
    deixeiDeLado: Uma transação única para o lote, que é mais rápida, mas perde tudo por causa de uma linha.
  - titulo: Logs com nome de evento
    resumo: >-
      Cada coisa que acontece vira uma linha de log com um nome fixo, fácil de buscar e de contar.
    escolha: >-
      Eventos como `SEM_URL_OU_TITULO`, `FALHA_EXTRACAO` e `RESUMO_INGESTAO`, sempre com o id da
      notícia.
    porque: >-
      Dá para achar qualquer falha com uma busca no arquivo de log e contar o que aconteceu em cada
      execução.
    deixeiDeLado: Mensagens livres, que são mais fáceis de escrever e difíceis de filtrar.
  - titulo: Janela de tempo fechada
    resumo: >-
      Cada execução busca um dia inteiro e fechado, então repetir a execução traz sempre o mesmo conjunto.
    escolha: Cada execução busca o dia anterior inteiro, no fuso de São Paulo, por timestamp.
    porque: >-
      A mesma execução, repetida no mesmo dia, pega o mesmo conjunto. Isso deixa o resultado previsível
      e fácil de conferir.
    deixeiDeLado: As "últimas 24 horas" a partir de agora, que mudam a cada execução.
