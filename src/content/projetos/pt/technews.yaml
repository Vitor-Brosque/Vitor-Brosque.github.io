titulo: TechNews
ordem: 3
frase: Pipeline de dados em Python que coleta, valida e guarda notícias de tecnologia no PostgreSQL.
status: desenvolvimento
statusTexto: Em desenvolvimento · código aberto
papel: Projeto de estudo, sozinho
periodo: "2026"
stack: [Python, PostgreSQL, psycopg 3, httpx, trafilatura, API do Hacker News]
links:
  codigo: https://github.com/Vitor-Brosque/TechNews
cartao: rota
emResumo: >-
  Pipeline em Python que busca no Hacker News as notícias do dia anterior, descarta o que vem
  incompleto ou repetido, extrai o texto da página original e grava no PostgreSQL sem duplicar.
  Numa execução de teste em 23/11/2026, coletou 81 notícias e extraiu o texto de 70 delas (86%).
  As outras 11 falharam no download (sites que bloqueiam robôs ou exigem login) ou na extração,
  e ficaram registradas no log.
resumo:
  problema: >-
    Eu queria entender, na prática, como um dado sai de uma API, passa por validação e chega limpo
    num banco.
  construi: >-
    Um pipeline que busca no Hacker News as notícias do dia anterior sobre 10 temas, descarta o que
    vem incompleto, extrai o texto da página e grava no PostgreSQL.
  orgulho: >-
    Rodar de novo não duplica nada, uma notícia com problema não derruba as outras, e cada etapa deixa
    um log com nome de evento.
problema: |-
  O TechNews é o meu laboratório de engenharia de dados. Comecei por ele para entender, na prática, cada etapa de um pipeline: de onde vem o dado, o que fazer quando ele chega quebrado e como garantir que rodar de novo não estraga nada.

  O código é pequeno de propósito. Cada etapa foi construída para eu entender o porquê de cada decisão.
rota:
  titulo: Da API ao banco
  paradas:
    - titulo: Coleta
      curto: Hacker News, dia anterior.
      texto: >-
        Consulta a API de busca do Hacker News atrás das notícias do dia anterior, no fuso de São
        Paulo, sobre 10 temas em 4 áreas: linguagens, IA, dados e DevOps.
    - titulo: Validação
      curto: Título e URL.
      texto: Descarta o que vem sem título ou sem URL e registra cada descarte no log.
    - titulo: Extração
      curto: Texto da página.
      texto: >-
        Baixa a página original e extrai o texto com o trafilatura. Falha no download ou na extração
        é registrada, e a notícia é pulada.
    - titulo: PostgreSQL
      curto: Sem duplicar.
      texto: >-
        Grava com `INSERT ... ON CONFLICT (fonte, id_externo) DO NOTHING RETURNING id`. Se não voltou
        id, era duplicada.
    - titulo: Resumo
      curto: Inseridas, duplicadas, rejeitadas.
      texto: >-
        No fim, um log diz quantas notícias foram inseridas, quantas eram duplicadas e quantas foram
        rejeitadas.
decisoes:
  - titulo: Idempotência no banco
    resumo: >-
      Rodar o pipeline duas vezes não duplica notícias: o próprio banco recusa a repetida e avisa que ela já existia.
    escolha: >-
      Chave única em `(fonte, id_externo)` e `INSERT ... ON CONFLICT DO NOTHING RETURNING id`.
    porque: >-
      Rodar o pipeline de novo, de propósito ou por engano, não duplica notícias. E o `RETURNING` diz,
      sem uma consulta extra, se a linha era nova ou repetida.
    deixeiDeLado: >-
      Checar se a notícia existe antes de inserir, que custa uma consulta a mais e ainda deixa uma
      janela para duplicar.
  - titulo: Uma notícia ruim não derruba o lote
    resumo: >-
      Cada notícia é gravada por conta própria. Se uma tiver problema, só ela é descartada e as outras seguem.
    escolha: >-
      Commit por notícia. Um `DataError` ou `IntegrityError` desfaz só aquela linha, que entra na
      conta das rejeitadas.
    porque: Num pipeline de ingestão, dado estranho é normal. O resto do lote precisa seguir.
    deixeiDeLado: Uma transação única para o lote, que é mais rápida, mas perde tudo por causa de uma linha.
  - titulo: Logs com nome de evento
    resumo: >-
      Cada coisa que acontece vira uma linha de log com um nome fixo, fácil de buscar e de contar.
    escolha: >-
      Eventos como `SEM_URL_OU_TITULO`, `FALHA_EXTRACAO` e `RESUMO_INGESTAO`, sempre com o id da
      notícia.
    porque: >-
      Dá para achar qualquer falha com uma busca no arquivo de log e contar o que aconteceu em cada
      execução.
    deixeiDeLado: Mensagens livres, que são mais fáceis de escrever e difíceis de filtrar.
  - titulo: Janela de tempo fechada
    resumo: >-
      Cada execução busca um dia inteiro e fechado, então repetir a execução traz sempre o mesmo conjunto.
    escolha: Cada execução busca o dia anterior inteiro, no fuso de São Paulo, por timestamp.
    porque: >-
      A mesma execução, repetida no mesmo dia, pega o mesmo conjunto. Isso deixa o resultado previsível
      e fácil de conferir.
    deixeiDeLado: As "últimas 24 horas" a partir de agora, que mudam a cada execução.
numeros:
  - { valor: "81", rotulo: "notícias coletadas em 10 buscas" }
  - { valor: "70", rotulo: "com o texto extraído (86%)" }
  - { valor: "21", rotulo: "descartadas na coleta: 12 sem título ou URL e 9 repetidas entre temas" }
  - { valor: "11", rotulo: "puladas com registro no log: 9 falhas de download e 2 de extração" }
numerosFonte: >-
  Execução das etapas de coleta, validação e extração em 23/11/2026, com as notícias de 22/11/2026,
  sem gravar no banco.
