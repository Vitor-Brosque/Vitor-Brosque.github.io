titulo: RodoviariaOS
ordem: 1
destaque: true
frase: O sistema que não deixa lead se perder e mostra quanto cada carro deu de lucro, na revenda da minha família.
status: producao
statusTexto: Em produção · código fechado
statusDetalhe: >-
  CRM, WhatsApp e estoque em uso todos os dias. Financeiro, assistente e radar de mercado
  prontos e testados, entrando em uso.
papel: Tudo, do banco de dados à interface, sozinho
periodo: Desde julho de 2026
stack: [TypeScript, Next.js 15, React 19, Tailwind CSS 4, Fastify 5, PostgreSQL 18, Drizzle ORM, Zod 4, Vitest]
links:
  vitrine: https://github.com/Vitor-Brosque/rodoviariaos-showcase
cartao: capa
capa:
  imagem: ../../../assets/projetos/rodoviariaos/painel-do-dia.png
  alt: Painel do dia do RodoviariaOS com resumo, pendências, estoque e financeiro do mês, na loja de demonstração, com dados inventados
emResumo: >-
  Sistema que a revenda da minha família usa todos os dias para não perder cliente. Desde julho de 2026 ele recebeu cerca de 1.000 leads e registrou perto de 11 mil mensagens de WhatsApp. Para cada lead, guarda de onde ele veio, qual carro quer e quando chamar de novo. Para cada carro, soma compra, preparação, impostos e comissão e mostra o lucro. Fiz tudo sozinho. O CRM, o WhatsApp e o estoque estão em uso; o financeiro, o assistente com IA e o radar de mercado estão prontos e entrando em uso.
resumo:
  problema: >-
    O vendedor recebia o lead e perdia o fio: não sabia de onde ele veio, qual carro queria, quão interessado estava nem quando chamar de novo. E ninguém sabia dizer quanto cada carro tinha dado de lucro.
  construi: >-
    Um sistema que guarda a origem, o carro e o interesse de cada lead, diz quem chamar agora e traz de volta quem sumiu. E que junta todos os ganhos e gastos de cada carro para mostrar o lucro.
  orgulho: >-
    O lead de anúncio chega já ligado ao carro certo, sem ninguém digitar. Cada sócio vê só os números dos próprios carros. E nenhuma mensagem sai para o cliente sem o vendedor revisar.
problema: |-
  Antes de programar, eu trabalhava no balcão da Rodoviária Veículos, a revenda da minha família. Cuidava dos anúncios, do estoque e do atendimento pelo WhatsApp.

  O vendedor recebia o lead e não conseguia acompanhar. Não dava para saber de onde ele tinha vindo, qual carro queria, quão interessado estava nem quando era hora de chamar de novo. Quem não respondia na hora sumia, e quando chegava um carro que servia para a pessoa ninguém lembrava dela.

  No dinheiro era parecido. Ninguém sabia dizer, carro a carro, quanto tinha entrado e quanto tinha saído: compra, manutenção, limpeza, imposto, comissão, retorno do financiamento. A loja tem mais de um sócio, cada um dono de carros diferentes, e a conta era feita em planilha e conversa.

  E para comprar um carro ou dar preço a ele, a pesquisa era abrir a FIPE e os anúncios, um por um.
rota:
  modo: loop
  titulo: A rota de um lead
  paradas:
    - titulo: O lead chega
      curto: Já com a origem e o carro do anúncio.
      texto: >-
        Pelo WhatsApp, por um anúncio da Meta ou pelo site da loja. O sistema lê de qual anúncio a pessoa veio e já liga o lead ao carro anunciado, sem ninguém digitar. O vendedor com menos atendimentos em aberto recebe o lead.
      midia:
        video: /media/rodoviariaos/do-whatsapp-a-fila.mp4
        imagem: ../../../assets/projetos/rodoviariaos/do-whatsapp-a-fila.png
        proporcao: 8/5
        alt: Uma mensagem de anúncio chega pelo WhatsApp, o lead aparece na fila e o vendedor responde com uma mensagem pronta, na loja de demonstração
    - titulo: O que ele quer
      curto: Carro de interesse, troca e temperatura.
      texto: >-
        A ficha do lead guarda a origem, o carro de interesse, se ele tem carro para dar na troca e a temperatura, que o vendedor marca. A IA pode sugerir a temperatura, citando o trecho da conversa. Se outro cliente se interessar pelo carro que entrou na troca, abre-se um lead novo para ele.
      midia:
        imagem: ../../../assets/projetos/rodoviariaos/conversa-lead-de-anuncio.png
        alt: Conversa de um lead que veio de anúncio, com a origem, o anúncio e o carro de interesse ao lado, com dados inventados
    - titulo: Quem chamar agora
      curto: Uma fila só, por próxima ação.
      texto: >-
        Cada lead cai numa fila só, nesta ordem: Responder, Primeiro contato, Tentativas e Negociação. Quem espera há mais tempo vem primeiro, e o placar do dia mostra quanto tempo a loja levou para responder.
      midia:
        imagem: ../../../assets/projetos/rodoviariaos/filas.png
        alt: Filas do CRM por próxima ação, com o placar do dia e o tempo de espera de cada lead, com dados inventados
    - titulo: Quando ele some
      curto: A mensagem de retomada já vem escrita.
      texto: >-
        Se o cliente para de responder, o sistema marca a próxima tentativa e sugere a mensagem. O vendedor revisa e envia: nada sai sozinho. Só contam as tentativas realmente feitas.
      midia:
        imagem: ../../../assets/projetos/rodoviariaos/mensagem-sugerida.png
        moldura: nenhuma
        alt: Mensagem de retomada sugerida pelo sistema para o vendedor revisar antes de enviar, com dados inventados
    - titulo: Resgate
      curto: Por tempo ou pelo carro de interesse.
      texto: >-
        Todo dia o sistema devolve à fila leads que ficaram em silêncio. A ficha de cada carro mostra os leads que combinam com ele e a temperatura de cada um. Quando um lead é retomado, o sistema mostra a FIPE atual e carros parecidos mais baratos.
      midia:
        imagem: ../../../assets/projetos/rodoviariaos/interessados.png
        alt: Ficha de um carro com a lista de leads interessados e a temperatura de cada um, com dados inventados
    - titulo: Da negociação à venda
      curto: Sinal, troca e financiamento, com a origem guardada.
      texto: >-
        A negociação é montada como acontece no balcão: sinal, carro na troca, PIX e financiamento. A origem do lead é registrada e não pode ser alterada depois, então a venda aponta para o anúncio que a trouxe.
      midia:
        video: /media/rodoviariaos/whatsapp-negociacao-celular.mp4
        imagem: ../../../assets/projetos/rodoviariaos/whatsapp-negociacao-celular.png
        proporcao: 780/1688
        moldura: celular
        alt: Conversa de WhatsApp virando negociação no RodoviariaOS, com dados inventados
funcionalidades:
  - titulo: Lucro de cada carro
    texto: >-
      Preço de venda menos tudo o que o carro custou: compra, manutenção, limpeza, documentação, comissão, garantia e impostos. Entra também o que veio junto com a venda, como o retorno do financiamento. O número fica Provisório até tudo ser pago e recebido.
    midia:
      imagem: ../../../assets/projetos/rodoviariaos/resultado-por-carro.png
      alt: Resultado por carro da loja de demonstração, com venda, aquisição, despesas, comissão, retorno e resultado de cada um, com dados inventados
  - titulo: O dossiê do carro
    texto: >-
      Cada carro tem a sua ficha: quanto custou, cada despesa com data, categoria e fornecedor, os documentos e o lucro previsto antes mesmo de vender.
    midia:
      imagem: ../../../assets/projetos/rodoviariaos/ficha-do-carro.png
      alt: Ficha de um carro com custo de aquisição, despesas por categoria, preço anunciado e margem estimada, com dados inventados
  - titulo: Para onde o dinheiro vai
    texto: >-
      Receitas e despesas do mês por categoria: venda de carro, retorno de financiamento, compra, oficina, limpeza, impostos, aluguel. E o acerto entre os sócios quando um deles paga uma conta da loja.
    midia:
      imagem: ../../../assets/projetos/rodoviariaos/dre-do-mes.png
      alt: Resultado do mês por categoria, com receitas e despesas da loja de demonstração, com dados inventados
  - titulo: O extrato do banco, conferido
    texto: >-
      O extrato é importado, o sistema sugere a categoria de cada linha com base no que já aprendeu e aponta o lançamento que bate. Extrato repetido é barrado antes de virar lançamento em dobro.
    midia:
      video: /media/rodoviariaos/extrato-e-conciliacao.mp4
      imagem: ../../../assets/projetos/rodoviariaos/extrato-e-conciliacao.png
      proporcao: 8/5
      alt: Importação de um extrato, sugestões de categoria aceitas e uma linha conciliada com o lançamento sugerido, na loja de demonstração
  - titulo: Radar de mercado
    texto: >-
      Anúncios de carros parecidos comparados com a mediana do mercado, corrigida pela quilometragem. Preço baixo demais vira "conferir" e nunca some da lista. Na ficha do carro, a tabela FIPE fica ao lado do preço anunciado.
    midia:
      imagem: ../../../assets/projetos/rodoviariaos/radar-de-compra.png
      alt: Lista de anúncios do mercado com os selos de oportunidade, de conferir e de saiu do ar, com dados inventados
  - titulo: Mesmo carro, dois sócios
    texto: >-
      O dono do carro vê custo e margem. O outro sócio vê só o catálogo. A regra vale nas telas, na API e no banco.
    midia:
      video: /media/rodoviariaos/dois-socios.mp4
      imagem: ../../../assets/projetos/rodoviariaos/dois-socios.png
      proporcao: 8/5
      alt: A mesma ficha de carro aberta pelo dono, com custo e resultado, e pelo outro sócio, só com catálogo e preço, na loja de demonstração
  - titulo: Assistente
    texto: >-
      Responde perguntas sobre estoque, leads e financeiro, respeita o que cada sócio pode ver e só registra algo depois de um "confirmo".
    midia:
      video: /media/rodoviariaos/assistente.mp4
      imagem: ../../../assets/projetos/rodoviariaos/assistente.png
      proporcao: 8/5
      alt: O assistente responde sobre carros parados, recusa mostrar o custo de um carro de outro sócio e lança uma despesa depois do confirmo, na loja de demonstração
  - titulo: Painel do dia
    texto: >-
      O que pede ação hoje num resumo só: tarefas, contas vencidas, leads sem resposta e carros parados.
    midia:
      imagem: ../../../assets/projetos/rodoviariaos/painel-do-dia.png
      alt: Painel do dia com resumo, tarefas, alertas, estoque e financeiro, na loja de demonstração, com dados inventados
  - titulo: Ocultar valores
    texto: Um clique esconde todos os valores da tela, para quando tem cliente no balcão.
    midia:
      video: /media/rodoviariaos/ocultar-valores.mp4
      imagem: ../../../assets/projetos/rodoviariaos/ocultar-valores.png
      proporcao: 4/5
      alt: Botão Ocultar valores trocando os valores da tela por pontos
arquitetura:
  titulo: Arquitetura
  texto: >-
    Toda requisição passa pela mesma estrada até o banco, e o banco só devolve o que aquela loja e
    aquele sócio podem ver. As mensagens do WhatsApp chegam por uma via lateral, com fila em tabela.
  nos:
    - id: navegador
      rotulo: Navegador
      detalhe: painel e celular
      col: 0
      lin: 0
      explicacao: >-
        O navegador só conversa com o Next.js. Os cookies de sessão são httpOnly e de primeira parte.
    - id: next
      rotulo: Next.js 15
      detalhe: App Router
      col: 1
      lin: 0
      explicacao: >-
        Serve as telas e repassa tudo o que é /api para a API, na mesma origem. Sem CORS e sem
        endereço da API embutido no código do navegador.
    - id: api
      rotulo: API Fastify
      detalhe: nega por padrão
      col: 2
      lin: 0
      explicacao: >-
        Cada requisição passa por log com dados sensíveis mascarados, autenticação que nega por
        padrão, checagem de papel e validação Zod da entrada e da saída.
    - id: tenant
      rotulo: withTenant()
      detalhe: loja · usuário · papel
      col: 3
      lin: 0
      explicacao: >-
        Abre uma transação e grava, só para ela, a loja, o usuário e o papel. Esses valores vêm só do
        token, nunca do corpo da requisição.
    - id: banco
      rotulo: PostgreSQL 18
      detalhe: Row-Level Security
      col: 4
      lin: 0
      destaque: true
      explicacao: >-
        As políticas de RLS filtram as linhas por loja e, nas tabelas financeiras, por sócio. A
        aplicação usa um usuário que não pode ignorar a RLS, então uma consulta sem contexto dá erro.
    - id: whatsapp
      rotulo: WhatsApp
      detalhe: webhook assinado
      col: 0
      lin: 1
      explicacao: Cada evento chega com uma assinatura HMAC, conferida sobre o corpo bruto da requisição.
    - id: fila
      rotulo: Fila em tabela
      detalhe: chave única
      col: 2
      lin: 1
      explicacao: >-
        O evento é gravado antes de ser processado, com chave única. Reentrega e replay não duplicam.
    - id: processador
      rotulo: Processador
      detalhe: 4 em paralelo
      col: 3
      lin: 1
      explicacao: >-
        Processa em segundo plano, com no máximo 4 ao mesmo tempo, novas tentativas com espera
        crescente e uma varredura a cada minuto. Ao terminar, avisa o painel do vendedor por SSE.
  faixas:
    - { de: navegador, para: next }
    - { de: next, para: api }
    - { de: api, para: tenant }
    - { de: tenant, para: banco }
    - { de: whatsapp, para: fila }
    - { de: fila, para: processador }
    - { de: processador, para: banco }
decisoes:
  - titulo: Isolamento no banco, não na disciplina
    resumo: >-
      Quem garante que uma loja não vê os dados da outra, nem um sócio os do outro, é o próprio banco de dados, e não o cuidado de quem escreve o código.
    escolha: >-
      Row-Level Security com `FORCE` em todas as tabelas com `tenant_id`, mais políticas
      `RESTRICTIVE` por dono nas tabelas financeiras.
    porque: >-
      Esquecer um `WHERE tenant_id` em qualquer consulta não pode vazar dados de outra loja nem do
      outro sócio. Sem contexto, a consulta falha em vez de devolver dados. Um teste falha se uma
      tabela nova ficar sem RLS, e um teste "canário" percorre todas as rotas de leitura com ids do
      outro sócio.
    deixeiDeLado: >-
      O filtro só na aplicação, mais simples de escrever, mas que depende de ninguém errar nunca. O
      custo da minha escolha: correções de dados em massa precisam de um laço por loja, algumas chaves
      estrangeiras entram como `NOT VALID` e o backup precisa de um usuário com mais privilégio.
  - titulo: Ingestão do WhatsApp feita para não perder nem duplicar
    resumo: >-
      Cada mensagem é guardada assim que chega e só depois é processada. Se algo falhar no meio, ela continua lá para a próxima tentativa.
    escolha: >-
      Webhook com assinatura HMAC conferida sobre o corpo bruto, gravação numa tabela com chave
      única antes de processar, e processamento em segundo plano com novas tentativas e varredura
      periódica.
    porque: >-
      Mensagem de cliente perdida é venda perdida, e mensagem duplicada vira lead duplicado. Gravar
      primeiro e processar depois separa "receber" de "entender". Se o processamento falha, a
      mensagem continua lá para a próxima tentativa.
    deixeiDeLado: >-
      Processar direto na requisição do webhook, que é mais rápido de fazer, mas perde o evento se
      algo falhar no meio.
  - titulo: IA que classifica, não que age
    resumo: >-
      A IA só entende o pedido. Quem executa é código comum, com as permissões de quem pediu, e nada é gravado sem um "confirmo".
    escolha: >-
      Regras reconhecem a maioria dos comandos. Quando nenhuma reconhece, a IA só escolhe uma
      intenção numa lista fechada de 26, por tool calling com a saída validada pelo Zod. Quem executa
      é código determinístico, com as permissões de quem pediu.
    porque: >-
      A IA nunca vê os dados da loja e nunca decide permissão. Toda escrita vira uma proposta que só
      executa com "confirmo", e esse "confirmo" é reconhecido por regra. O assistente funciona até sem
      chave de IA, e cada loja tem um teto mensal de gasto.
    deixeiDeLado: >-
      Um agente livre com acesso ao banco, que entenderia mais pedidos, mas seria imprevisível, caro
      e difícil de proteger contra injeção de prompt.
  - titulo: Extrato com "prova real"
    resumo: >-
      Ao importar um extrato, a soma dos lançamentos precisa bater com o saldo que o banco imprimiu. Se não bater, o arquivo é recusado.
    escolha: >-
      Leitores de OFX, CSV, XLSX e PDF escritos no próprio projeto. Nos PDFs, a soma dos lançamentos
      precisa bater, centavo a centavo, com cada saldo diário impresso pelo banco.
    porque: >-
      Importar um extrato errado é pior do que recusar. Arquivo repetido é barrado pelo SHA-256, e
      linhas iguais só viram duplicata se o extrato anterior tinha a mesma quantidade delas: duas
      tarifas iguais no mesmo dia continuam sendo duas. A conciliação sugere candidatos com nota, mas
      nunca vincula sozinha.
    deixeiDeLado: >-
      Classificar as linhas com IA. Preferi regras aprendidas a cada classificação confirmada, que são
      previsíveis e podem ser desfeitas linha a linha.
  - titulo: Sem Redis, sem fila e sem cron, de propósito
    resumo: >-
      Menos peças para manter: o banco de dados faz também o papel de fila e de cache, o que é suficiente para o tamanho de uma loja.
    escolha: >-
      O Postgres faz o papel de fila (webhooks), cache (consulta de placa) e rate limit (login). Os
      jobs são timers dentro do processo da API.
    porque: >-
      Um servidor só, com menos peças para operar e monitorar, é o tamanho certo para uma loja. Cada
      peça a menos é uma peça a menos para cair.
    deixeiDeLado: >-
      A escala horizontal. O SSE é em memória, um job só roda com a API no ar, e reiniciar zera os
      relógios. É uma troca consciente para o tamanho atual, e migrar para uma fila dedicada é simples,
      porque a fila já é uma tabela.
  - titulo: Deploy em gates
    resumo: >-
      Cada atualização passa por etapas que só avançam se a anterior deu certo, com backup antes e volta automática se algo falhar.
    escolha: >-
      Cada rodada passa por etapas que só começam se a anterior passou: testes e typecheck, backup do
      banco, migrations numa transação, build isolado com sha256 de cada artefato, troca com rollback
      automático e validação.
    porque: Uma atualização que falha no meio não pode derrubar a loja. Se a troca falha, a versão anterior volta sozinha.
    deixeiDeLado: O CI/CD automático. Como o código é fechado, preferi controle humano, com um roteiro escrito para cada rodada.
numeros:
  - { valor: "~1.000", rotulo: "leads recebidos desde julho de 2026" }
  - { valor: "~11 mil", rotulo: "mensagens de WhatsApp registradas, de agosto a novembro de 2026" }
  - { valor: "36", rotulo: "carros no estoque, acompanhados pelo sistema" }
  - { valor: "1.400+", rotulo: "testes automáticos da API, rodando num banco de dados de verdade" }
numerosFonte: >-
  Lidos no banco de produção em 23/11/2026. Leads, mensagens e estoque vêm dos módulos em uso. O financeiro e o assistente ainda não têm volume real.
proximos:
  - Colocar o financeiro e o assistente em uso diário na loja.
  - Publicar a extensão do radar de mercado e conferir com os portais reais.
  - Enviar as conversões de volta para a Meta, para medir melhor os anúncios.
  - Preparar o sistema para outras revendas.
seo:
  descricao: >-
    Estudo de caso do RodoviariaOS: o sistema que acompanha cada lead até a venda e mostra o lucro de cada carro numa revenda, com PostgreSQL e WhatsApp.
