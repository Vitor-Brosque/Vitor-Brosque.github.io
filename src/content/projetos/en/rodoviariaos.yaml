titulo: RodoviariaOS
ordem: 1
destaque: true
frase: The system that keeps leads from slipping away and shows how much each car made, at my family's car dealership.
status: producao
statusTexto: In production · closed source
statusDetalhe: >-
  CRM, WhatsApp and inventory are in daily use. Finance, the assistant and the market radar are
  built and tested, and are being rolled out.
papel: My own project, from the problem to running it at the store, with the code written with AI
periodo: Since July 2026
stack: [TypeScript, Next.js 15, React 19, Tailwind CSS 4, Fastify 5, PostgreSQL 18, Drizzle ORM, Zod 4, Vitest]
links:
  vitrine: https://github.com/Vitor-Brosque/rodoviariaos-showcase
cartao: capa
capa:
  imagem: ../../../assets/projetos/rodoviariaos/painel-do-dia.png
  alt: RodoviariaOS daily dashboard with summary, pending items, inventory and the month's finances, in the demo store, with made-up data
emResumo: >-
  The system my family's car dealership uses every day so it doesn't lose customers. Since July 2026 it has received about 1,000 leads and logged about 13,000 WhatsApp messages. For each lead, it keeps where they came from, which car they want and when to call again. For each car, it adds up purchase, preparation, taxes and commission and shows the profit. The code was written with AI: I defined the problem, the rules and how each part works, and guided the technical decisions. The CRM, WhatsApp and inventory are in use; finance, the AI assistant and the market radar are built and being rolled out.
resumo:
  problema: >-
    The salesperson got the lead and lost the thread: no way to tell where it came from, which car they wanted, how interested they were or when to call again. And nobody could say how much each car had made.
  construi: >-
    A system that keeps the source, the car and the interest of every lead, says who to call now and brings back the ones who went quiet. And that puts together every gain and cost of each car to show the profit.
  orgulho: >-
    A lead from an ad arrives already linked to the right car, with nobody typing. Each partner sees only the numbers for their own cars. And no message goes out to a customer before the salesperson reviews it.
problema: |-
  Before building the system, I worked the counter at Rodoviária Veículos, my family's car dealership. I took care of the ads, the inventory and customer service on WhatsApp.

  The salesperson got the lead and couldn't keep up with it. There was no way to tell where it had come from, which car the person wanted, how interested they were or when it was time to call again. Anyone who didn't answer right away disappeared, and when a car that suited them arrived, nobody remembered them.

  Money was similar. Nobody could say, car by car, how much had come in and how much had gone out: purchase, repairs, cleaning, taxes, commission, the bank's financing commission. The dealership has more than one partner, each owning different cars, and the math was done in spreadsheets and conversations.

  And to buy a car or price one, market research meant opening FIPE, Brazil's reference price table, and the listings, one by one.
rota:
  titulo: The route of a lead
  paradas:
    - titulo: The lead arrives
      curto: Already with its source and the car from the ad.
      texto: >-
        Through WhatsApp, a Meta ad or the dealership's website. The system reads which ad the person came from and links the lead to the advertised car, with nobody typing. The salesperson with the fewest open leads gets it.
      midia:
        video: /media/rodoviariaos/do-whatsapp-a-fila.mp4
        imagem: ../../../assets/projetos/rodoviariaos/do-whatsapp-a-fila.png
        proporcao: 8/5
        alt: An ad message arrives on WhatsApp, the lead shows up in the queue and the salesperson answers with a ready-made message, in the demo store
    - titulo: What they want
      curto: Car of interest, trade-in and temperature.
      texto: >-
        The lead's record keeps the source, the car of interest, whether they have a car to trade in, and the temperature, which the salesperson sets. The AI can suggest the temperature, quoting the part of the conversation it used. If another customer gets interested in the trade-in car, a new lead is opened for them.
      midia:
        imagem: ../../../assets/projetos/rodoviariaos/conversa-lead-de-anuncio.png
        alt: Conversation with a lead that came from an ad, with the source, the ad and the car of interest on the side, with made-up data
    - titulo: Who to call now
      curto: One queue, by next action.
      texto: >-
        Every lead lands in a single queue, in this order: Reply, First contact, Attempts and Negotiation. Whoever has waited longest comes first, and the day's scoreboard shows how long the store took to answer.
      midia:
        imagem: ../../../assets/projetos/rodoviariaos/filas.png
        alt: CRM queues by next action, with the day's scoreboard and how long each lead has waited, with made-up data
    - titulo: When they go quiet
      curto: The follow-up message is already written.
      texto: >-
        If the customer stops answering, the system schedules the next attempt and suggests the message. The salesperson reviews and sends it: nothing goes out by itself. Only attempts that were actually made count.
      midia:
        imagem: ../../../assets/projetos/rodoviariaos/mensagem-sugerida.png
        moldura: nenhuma
        alt: Follow-up message suggested by the system for the salesperson to review before sending, with made-up data
    - titulo: Rescue
      curto: By time or by the car of interest.
      texto: >-
        Every day the system puts leads that went silent back in the queue. Each car's record shows the leads that match it and how warm each one is. When a lead is picked up again, the system shows the current FIPE price and similar cars that cost less.
      midia:
        imagem: ../../../assets/projetos/rodoviariaos/interessados.png
        alt: A car's record with the list of interested leads and the temperature of each one, with made-up data
    - titulo: From negotiation to sale
      curto: Deposit, trade-in and financing, with the source kept.
      texto: >-
        The negotiation is built the way it happens at the counter: deposit, trade-in, PIX and financing. The lead's source is recorded and can't be changed afterwards, so the sale points to the ad that brought it.
      midia:
        video: /media/rodoviariaos/whatsapp-negociacao-celular.mp4
        imagem: ../../../assets/projetos/rodoviariaos/whatsapp-negociacao-celular.png
        proporcao: 780/1688
        moldura: celular
        alt: A WhatsApp conversation turning into a negotiation in RodoviariaOS, using made-up data
funcionalidades:
  - titulo: Profit per car
    texto: >-
      Sale price minus everything the car cost: purchase, repairs, cleaning, paperwork, commission, warranty and taxes. What came in with the sale counts too, such as the bank's financing commission. The number stays Provisional until everything is paid and received.
    midia:
      imagem: ../../../assets/projetos/rodoviariaos/resultado-por-carro.png
      alt: Profit per car in the demo store, with sale, purchase, expenses, commission, financing commission and result for each one, with made-up data
  - titulo: The car's file
    texto: >-
      Each car has its own record: what it cost, every expense with date, category and supplier, the documents and the expected profit even before it sells.
    midia:
      imagem: ../../../assets/projetos/rodoviariaos/ficha-do-carro.png
      alt: A car's record with purchase cost, expenses by category, asking price and estimated margin, with made-up data
  - titulo: Where the money goes
    texto: >-
      The month's income and expenses by category: car sales, financing commission, purchases, repairs, cleaning, taxes, rent. And the settlement between partners when one of them pays a store bill.
    midia:
      imagem: ../../../assets/projetos/rodoviariaos/dre-do-mes.png
      alt: The month's result by category, with the demo store's income and expenses, with made-up data
  - titulo: The bank statement, checked
    texto: >-
      The statement is imported, the system suggests a category for each line based on what it has learned and points to the entry that matches. A repeated statement is caught before it becomes a duplicate entry.
    midia:
      video: /media/rodoviariaos/extrato-e-conciliacao.mp4
      imagem: ../../../assets/projetos/rodoviariaos/extrato-e-conciliacao.png
      proporcao: 8/5
      alt: A statement being imported, category suggestions accepted and a line matched with the suggested entry, in the demo store
  - titulo: Market radar
    texto: >-
      Listings of similar cars compared with the market median, adjusted for mileage. A price that is too low becomes "check" and never disappears from the list. On the car's record, the FIPE price table sits next to the asking price.
    midia:
      imagem: ../../../assets/projetos/rodoviariaos/radar-de-compra.png
      alt: List of market listings with the opportunity, check and taken-down badges, with made-up data
  - titulo: Same car, two partners
    texto: >-
      The car's owner sees cost and margin. The other partner sees only the catalog. The rule holds
      in the screens, the API and the database.
    midia:
      video: /media/rodoviariaos/dois-socios.mp4
      imagem: ../../../assets/projetos/rodoviariaos/dois-socios.png
      proporcao: 8/5
      alt: The same car record opened by its owner, with cost and result, and by the other partner, with only the catalog and the price, in the demo store
  - titulo: Assistant
    texto: >-
      Answers questions about inventory, leads and finance, respects what each partner is allowed to see and only records something after a "confirm".
    midia:
      video: /media/rodoviariaos/assistente.mp4
      imagem: ../../../assets/projetos/rodoviariaos/assistente.png
      proporcao: 8/5
      alt: The assistant answers about cars that are not selling, refuses to show the cost of another partner's car and records an expense after the confirmation, in the demo store
  - titulo: Daily dashboard
    texto: >-
      What needs action today in a single summary: tasks, overdue bills, unanswered leads and cars
      sitting too long.
    midia:
      imagem: ../../../assets/projetos/rodoviariaos/painel-do-dia.png
      alt: Daily dashboard with summary, tasks, alerts, inventory and finances, in the demo store, with made-up data
  - titulo: Hide values
    texto: One click hides every amount on screen, for when there's a customer at the counter.
    midia:
      video: /media/rodoviariaos/ocultar-valores.mp4
      imagem: ../../../assets/projetos/rodoviariaos/ocultar-valores.png
      proporcao: 4/5
      alt: The Hide values button replacing every amount on screen with dots
arquitetura:
  titulo: Architecture
  texto: >-
    Every request travels the same road to the database, and the database only returns what that
    store and that partner are allowed to see. WhatsApp messages arrive through a side road, with a
    table-backed queue.
  nos:
    - { id: navegador, rotulo: Browser, detalhe: dashboard and phone, col: 0, lin: 0, explicacao: "The browser only talks to Next.js. Session cookies are httpOnly and first-party." }
    - { id: next, rotulo: Next.js 15, detalhe: App Router, col: 1, lin: 0, explicacao: "Serves the screens and forwards everything under /api to the API, on the same origin. No CORS, and no API address baked into the browser code." }
    - { id: api, rotulo: Fastify API, detalhe: deny by default, col: 2, lin: 0, explicacao: "Every request goes through logging with sensitive data masked, authentication that denies by default, a role check and Zod validation of input and output." }
    - { id: tenant, rotulo: withTenant(), detalhe: store · user · role, col: 3, lin: 0, explicacao: "Opens a transaction and sets, for that transaction only, the store, the user and the role. These values come only from the token, never from the request body." }
    - { id: banco, rotulo: PostgreSQL 18, detalhe: Row-Level Security, col: 4, lin: 0, destaque: true, explicacao: "RLS policies filter rows by store and, in the finance tables, by partner. The app uses a database user that cannot bypass RLS, so a query without context fails." }
    - { id: whatsapp, rotulo: WhatsApp, detalhe: signed webhook, col: 0, lin: 1, explicacao: "Every event arrives with an HMAC signature, checked against the raw request body." }
    - { id: fila, rotulo: Table queue, detalhe: unique key, col: 2, lin: 1, explicacao: "The event is stored before it is processed, with a unique key. Redelivery and replay don't create duplicates." }
    - { id: processador, rotulo: Processor, detalhe: 4 in parallel, col: 3, lin: 1, explicacao: "Processes in the background, at most 4 at a time, with retries and growing backoff and a sweep every minute. When done, it notifies the salesperson's dashboard over SSE." }
  faixas:
    - { de: navegador, para: next }
    - { de: next, para: api }
    - { de: api, para: tenant }
    - { de: tenant, para: banco }
    - { de: whatsapp, para: fila }
    - { de: fila, para: processador }
    - { de: processador, para: banco }
decisoes:
  - titulo: Isolation in the database, not in discipline
    resumo: >-
      The database itself guarantees that one store can't see another's data and one partner can't see the other's. It doesn't depend on the care of whoever writes the code.
    escolha: >-
      Row-Level Security with `FORCE` on every table that has a `tenant_id`, plus `RESTRICTIVE`
      per-owner policies on the finance tables.
    porque: >-
      Forgetting a `WHERE tenant_id` in any query must not leak another store's or the other
      partner's data. Without context, the query fails instead of returning data. A test fails if a
      new table ships without RLS, and a "canary" test walks every read route with the other
      partner's ids.
    deixeiDeLado: >-
      Filtering only in the application, which is simpler to write but relies on nobody ever making a
      mistake. The cost of my choice: bulk data fixes need a loop per store, some foreign keys go in
      as `NOT VALID`, and backups need a more privileged user.
  - titulo: WhatsApp ingestion built not to lose or duplicate
    resumo: >-
      Every message is stored the moment it arrives and processed afterwards. If something fails halfway, it is still there for the next attempt.
    escolha: >-
      A webhook with an HMAC signature checked against the raw body, stored in a table with a unique
      key before processing, then processed in the background with retries and a periodic sweep.
    porque: >-
      A lost customer message is a lost sale, and a duplicated message becomes a duplicated lead.
      Storing first and processing later separates "receiving" from "understanding". If processing
      fails, the message is still there for the next attempt.
    deixeiDeLado: >-
      Processing directly inside the webhook request, which is quicker to build but loses the event
      if anything fails halfway.
  - titulo: AI that classifies, not acts
    resumo: >-
      The AI only understands the request. Ordinary code does the work, with the permissions of whoever asked, and nothing is saved without a "confirm".
    escolha: >-
      Rules recognize most commands. When none does, the AI only picks one intent from a closed list
      of 26, through tool calling with Zod-validated output. Deterministic code does the work, with
      the permissions of whoever asked.
    porque: >-
      The AI never sees the store's data and never decides permissions. Every write becomes a
      proposal that only runs after a "confirm", and that "confirm" is recognized by a rule. The
      assistant works even without an AI key, and each store has a monthly spending cap.
    deixeiDeLado: >-
      A free-roaming agent with database access, which would understand more requests but would be
      unpredictable, expensive and hard to protect against prompt injection.
  - titulo: Bank statements with a "proof check"
    resumo: >-
      When a bank statement is imported, the entries must add up to the balance the bank printed. If they don't, the file is rejected.
    escolha: >-
      Readers for OFX, CSV, XLSX and PDF written in the project itself. For PDFs, the sum of the
      entries must match, to the cent, every daily balance the bank printed.
    porque: >-
      Importing a wrong statement is worse than rejecting it. A repeated file is blocked by its
      SHA-256, and identical lines only count as duplicates if the previous statement had the same
      number of them: two identical fees on the same day are still two. Reconciliation suggests
      scored candidates but never links anything on its own.
    deixeiDeLado: >-
      Classifying lines with AI. I chose rules learned from every confirmed classification, which are
      predictable and can be undone line by line.
  - titulo: No Redis, no queue, no cron, on purpose
    resumo: >-
      Fewer parts to maintain: the database also plays the role of queue and cache, which is enough for a single dealership.
    escolha: >-
      Postgres plays the role of queue (webhooks), cache (license plate lookup) and rate limiter
      (login). Jobs are timers inside the API process.
    porque: >-
      A single server with fewer moving parts to run and monitor is the right size for one
      dealership. Every part you don't have is a part that can't go down.
    deixeiDeLado: >-
      Horizontal scaling. SSE lives in memory, a job only runs while the API is up, and a restart
      resets the timers. It's a deliberate trade-off for the current size, and moving to a dedicated
      queue is simple because the queue is already a table.
  - titulo: Gated deploys
    resumo: >-
      Every update goes through steps that only move forward if the previous one succeeded, with a backup first and an automatic rollback if anything fails.
    escolha: >-
      Every release goes through steps that only start if the previous one passed: tests and
      typecheck, database backup, migrations in a transaction, an isolated build with a sha256 for
      every artifact, a switch with automatic rollback, and validation.
    porque: An update that fails halfway must not take the dealership down. If the switch fails, the previous version comes back on its own.
    deixeiDeLado: Automated CI/CD. Because the code is closed, I chose human control, with a written runbook for every release.
