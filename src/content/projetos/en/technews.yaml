  - { valor: "11", rotulo: "skipped and logged: 9 download failures and 2 extraction failures" }
numerosFonte: >-
  Collection, validation and extraction steps run on Nov 23, 2026, with the stories from Nov 22, 2026,
  without writing to the database.
situacao: |-
  The project is at the beginning. Today the first part of the flow exists: collecting from Hacker News, validating, extracting the text and writing to PostgreSQL. In a test run on Nov 23, 2026, it collected 81 stories and extracted the text of 70 of them (86%).

  Right now I'm deciding the next sources and building the collectors that feed the database, with their fallbacks. The AI and the reading screen are already designed and come next.
proximos:
  - Add the next sources, with a fallback for when one fails.
  - Run the stories through an AI that filters, classifies and summarizes.
  - Show the result on a screen to read every morning, save what I like and delete the rest after a set time.
  - Schedule the daily run.
  - Write tests for each step, with recorded API responses.
  - Download pages in parallel, with a concurrency limit.
seo:
  descricao: >-
    TechNews case study: a Python and PostgreSQL pipeline for keeping up with tech news, with
    idempotency, per-row commits and logs with named events.
