emResumo: >-
  There are too many sites and too much news, and I kept getting lost in what's new in tech. TechNews
  was designed to fix that: it gathers the news on the topics I follow, runs it through an AI that
  filters, classifies and summarizes, and hands it all to me on a screen to read every morning. What
  I like, I save. The rest goes away on its own after a set time.
resumo:
  problema: >-
    There are too many sites and too much news. I kept getting lost in what's new in tech and wanted
    to read only what matters, every morning.
  construi: >-
    The first part of the pipeline: it fetches the previous day's Hacker News stories on 10 topics,
    drops incomplete ones, extracts the page text and stores it in PostgreSQL.
  orgulho: >-
    Running it again duplicates nothing, one bad story doesn't take the others down, and every step
    leaves a log with a named event.
problema: |-
  Keeping up with tech became a volume problem. There are many sites and a lot of news every day, and I kept getting lost, not knowing what was worth reading.

  TechNews is my answer, and this is how it was designed: it fetches the news on the topics I follow, stores it in the database, runs it through an AI that filters, classifies and summarizes, and shows me the result on a screen, so I can read it every morning. What I like, I save. What I don't save gets deleted after a set time, once newer stories arrive.

  It is also my data engineering lab: each step is built so I understand the reason behind every decision.
rota:
  modo: loop
  titulo: From the sources to the morning read
  paradas:
    - titulo: Sources
      curto: Sites and APIs on the topics I follow.
      texto: >-
        The news comes from tech sites and APIs, always on the topics I follow. Each source has its
        own collector, and a fallback takes over when a source fails.
    - titulo: Collect
      curto: The previous day's stories.
      texto: >-
        Each collector fetches the previous day's stories, in São Paulo time. The Hacker News one
        queries the search API on 10 topics across 4 areas: languages, AI, data and DevOps. Anything
        with no title or URL, or repeated across topics, is dropped and logged.
      log: "WARNING | SEM_URL_OU_TITULO | ID = 46012907"
    - titulo: Extract
      curto: Text of the original page.
      texto: >-
        Downloads the original page and extracts the text with trafilatura. A download or extraction
        failure is logged, and the story is skipped.
      log: "INFO | EXTRACAO_OK | ID = 46013377"
    - titulo: PostgreSQL
      curto: Stores without duplicates.
      texto: >-
        Writes with `INSERT ... ON CONFLICT (fonte, id_externo) DO NOTHING RETURNING id`. If no id
        comes back, it was a duplicate. At the end, a log line says how many stories were inserted,
        how many were duplicates and how many were rejected.
      log: "INFO | RESUMO_INGESTAO | INSERIDAS=… | DUPLICADAS=… | REJEITADAS=…"
    - titulo: AI
      curto: Filters, classifies and summarizes.
      texto: >-
        The stories stored in the database go through an AI that filters, classifies and summarizes
        each one.
    - titulo: Morning read
      curto: Save what I like.
      texto: >-
        The result shows up on a screen, so I can read what's new every morning, concisely. What I
        like, I save. What I don't save gets deleted after a set time, once newer stories arrive.
decisoes:
  - titulo: Idempotency in the database
    resumo: >-
      Running the pipeline twice doesn't duplicate stories: the database itself rejects the repeat and reports that it already existed.
    escolha: A unique key on `(fonte, id_externo)` and `INSERT ... ON CONFLICT DO NOTHING RETURNING id`.
    porque: >-
      Running the pipeline again, on purpose or by mistake, doesn't duplicate stories. And `RETURNING`
      tells me, without an extra query, whether the row was new or repeated.
    deixeiDeLado: Checking whether the story exists before inserting, which costs an extra query and still leaves a window for duplicates.
  - titulo: One bad story doesn't sink the batch
    resumo: >-
      Each story is saved on its own. If one has a problem, only that one is dropped and the rest carry on.
    escolha: A commit per story. A `DataError` or `IntegrityError` rolls back only that row, which counts as rejected.
    porque: In an ingestion pipeline, odd data is normal. The rest of the batch has to keep going.
    deixeiDeLado: A single transaction for the whole batch, which is faster but loses everything because of one row.
  - titulo: Logs with named events
    resumo: >-
      Everything that happens becomes a log line with a fixed name, easy to search and to count.
    escolha: Events such as `SEM_URL_OU_TITULO`, `FALHA_EXTRACAO` and `RESUMO_INGESTAO`, always with the story id.
    porque: Any failure can be found with a search in the log file, and each run can be summed up.
    deixeiDeLado: Free-form messages, easier to write and hard to filter.
  - titulo: A closed time window
    resumo: >-
      Each run fetches one whole, closed day, so repeating the run always returns the same set.
    escolha: Each run fetches the entire previous day, in São Paulo time, by timestamp.
    porque: The same run repeated on the same day gets the same set, which keeps the result predictable and easy to check.
    deixeiDeLado: The "last 24 hours" from now, which changes with every run.
numeros:
