resumo:
  problema: >-
    I know what I need to do, but I freeze when it's time to start. Long lists overwhelm me and rigid
    plans turn into guilt.
  construi: >-
    An app that shows one quest at a time, adapts to the kind of day I'm having and works offline,
    syncing my phone and my PC.
  orgulho: >-
    Cursor-based sync with near real-time updates, pure domain rules and decisions grounded in 64
    scientific sources.
problema: |-
  Often I know what I need to do, but I freeze when it's time to start. Long lists overwhelm me, rigid plans turn into guilt when they fail, and to-do apps record what to do without helping me do it.

  Life RPG tries to close the gap between knowing and doing. It shows one quest at a time, with a small first step, and adapts to the kind of day: normal, low energy, recovery or free. Nothing resets, nothing decays and nothing turns red: a slow day doesn't erase progress.

  I use it every day, on my phone and on my PC. That's why it had to work offline and keep both devices in sync.
rota:
  titulo: The route of a change
  paradas:
    - titulo: You tap on your phone
      curto: Saved to IndexedDB, no waiting for the network.
      texto: >-
        The write goes straight to the device's IndexedDB. The UI never waits for the network, and the
        app works with the server turned off.
      midia:
        imagem: ../../../assets/projetos/life-rpg/agora.png
        moldura: celular
        alt: Life RPG Now screen, with the current block and one quest at a time
    - titulo: Sync
      curto: Sends the cursor and the changes.
      texto: >-
        The device sends `POST /api/sync` with its cursor and local changes, and gets back everything
        that changed since that cursor.
    - titulo: Server
      curto: Last-write-wins and a global revision.
      texto: >-
        The Fastify API applies the changes with last-write-wins (the most recent `updatedAt` wins) and
        bumps the global revision in SQLite.
    - titulo: Notifying devices
      curto: Server-Sent Events.
      texto: When a new revision comes in, the server notifies the other devices through Server-Sent Events.
    - titulo: Dashboard on the PC
      curto: Updates in near real time.
      texto: The Dashboard open on the second monitor updates in near real time.
      midia:
        imagem: ../../../assets/projetos/life-rpg/painel.png
        alt: Life RPG dashboard on the computer, with the current quest, the day's timeline and a timer
