arquitetura:
  titulo: Architecture
  texto: >-
    Everything is saved on the device first. The server is where devices meet and where backups live,
    not a requirement for using the app.
  nos:
    - { id: app, rotulo: React 19 PWA, detalhe: Zustand · service worker, col: 0, lin: 0, explicacao: "React screens with state in Zustand. The service worker makes the app installable and available offline." }
    - { id: idb, rotulo: IndexedDB, detalhe: Dexie 4, col: 1, lin: 0, explicacao: "Everything is saved on the device first. The UI never waits for the network." }
    - { id: api, rotulo: Fastify 5 API, detalhe: POST /api/sync, col: 2, lin: 0, explicacao: "Receives changes with the device's cursor and returns what changed since then. On conflict, the most recent updatedAt wins." }
    - { id: sqlite, rotulo: SQLite, detalhe: "node:sqlite", col: 3, lin: 0, destaque: true, explicacao: "Node 24's built-in database, with a global revision that only grows. If the database was restored from a backup and a device knows revisions it doesn't have, the device starts over and resends everything." }
    - { id: backup, rotulo: Daily backup, detalhe: media by SHA-256, col: 4, lin: 0, explicacao: "Backups kept for 14 days. Media is stored by its SHA-256 hash and mirrored with hard links, using no extra space." }
    - { id: sse, rotulo: SSE, detalhe: /api/stream, col: 3, lin: 1, explicacao: "Notifies the other devices when a new revision comes in." }
    - { id: painel, rotulo: Dashboard on PC, detalhe: live updates, col: 4, lin: 1, explicacao: "The Dashboard on the second monitor follows the phone in near real time." }
  faixas:
    - { de: app, para: idb }
    - { de: idb, para: api }
    - { de: api, para: sqlite }
    - { de: sqlite, para: backup }
    - { de: api, para: sse }
    - { de: sse, para: painel }
decisoes:
  - titulo: Truly offline-first
    escolha: Everything is saved to IndexedDB first, and syncing happens afterwards.
    porque: I use it on my phone anywhere. The UI never waits for the network, and the app works with the server off.
    deixeiDeLado: An online-only app, simpler to write but useless without signal.
  - titulo: Cursor-based sync and last-write-wins
    escolha: >-
      The server keeps a global revision. Each device sends its own changes and gets back what changed
      since its cursor. On conflict, the most recent `updatedAt` wins.
    porque: >-
      For a single user with few real conflicts, last-write-wins is predictable and easy to test. If
      the server is restored from a backup and a device knows revisions it doesn't have, the device
      starts over and resends everything.
    deixeiDeLado: >-
      CRDTs, which would resolve simultaneous edits without loss, at a complexity that doesn't pay off
      for one person.
  - titulo: Pure domain rules
    escolha: >-
      The day scheduler, XP, recurrence, FSRS, patterns, the Portuguese parser and merging live in
      `packages/shared`, with no browser or server.
    porque: The most important rules become pure functions, easy to test and shared by both sides.
    deixeiDeLado: Logic spread across components, faster at first and a nightmare to test later.
  - titulo: Content-addressed media
    escolha: Images and audio are stored by their SHA-256 hash, and the daily backup mirrors media with hard links.
    porque: The same file is never stored twice, and 14 days of backups take no extra space for repeated media.
    deixeiDeLado: File names by id, which would duplicate media in every backup.
  - titulo: Secure even though it's personal
    escolha: >-
      A token compared in constant time, a server listening only on `127.0.0.1`, and remote access over
      Tailscale HTTPS. The AI key lives only on the server.
    porque: It's a home server with my personal data. Nothing is exposed directly to the internet.
    deixeiDeLado: Opening a port on the router, which would be simpler and much riskier.
  - titulo: Evidence before gamification
    escolha: I gathered 64 scientific sources on habits, learning and sleep, and checked every rule in the app against them.
    porque: >-
      Badly designed gamification rewards the wrong thing. That's why logging sleep gives no XP:
      rewarding the logging instead of the behavior can hurt motivation.
    deixeiDeLado: >-
      XP for everything, which feels motivating and creates the wrong incentive. XP, levels and the map
      are treated as personal taste, not as a proven technique.
