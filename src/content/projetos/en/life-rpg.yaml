titulo: Life RPG
ordem: 2
frase: A pixel-art app that turns routine and study into a game, built to help on the hard days.
status: aberto
statusTexto: Open source (MIT) · in use on the PC
statusDetalhe: In use on the PC since November 2026. Still to come are iPhone access, the AI with a real key, and CI.
papel: Personal project, from design to infrastructure
periodo: "2026"
stack: [TypeScript, React 19, Vite, Dexie (IndexedDB), Zustand, Fastify 5, "SQLite (node:sqlite)", Zod 4, ts-fsrs, Vitest]
links:
  codigo: https://github.com/Vitor-Brosque/life-rpg
cartao: capa
tema: rpg
capa:
  imagem: ../../../assets/projetos/life-rpg/mapa.png
  moldura: celular
  alt: Life RPG world map in pixel art, with six territories (village, hamlet, camps and ruins) joined by trails and a character at the center
emResumo: >-
  I started Life RPG to get organized, and it grew: today, in its third version, it brings routine,
  study and habits together in a pixel-art game, designed for the hard days, when energy is low and
  progress is hard to feel. I have used it on my PC since November 2026. It was built to work offline
  on the phone and sync with the PC in near real time. The code is open, with tests, and the app's
  rules were compared with a research base of 63 sources on habits and learning.
resumo:
  problema: >-
    On a good day everything is easy. The hard part is the bad days: freezing when it's time to start,
    not feeling progress, and giving up.
  construi: >-
    An app that shows one quest at a time, adapts to the kind of day I'm having and was built to work
    offline and sync my phone and my PC.
  orgulho: >-
    Cursor-based sync with near real-time updates, pure domain rules and decisions reviewed against a
    research base of 63 sources.
problema: |-
  I have been trying to build this app since late 2025, and this is already the third version. I started it to get organized. Then I saw I could bring my studies into the same place, and little by little other things came in, like sleep habits. Along the way I was reading about neuroscience and how habits form, and trying to bring what I learned into my day-to-day.

  What I wanted to solve wasn't the good days. With motivation and energy, everything is easy. The hard part is the bad days: not feeling progress, not quite understanding what I'm doing, and the feelings that lead to procrastinating and giving up.

  That's why the app became a game. It shows one quest at a time, with a small first step, and adapts to the kind of day: normal, low energy, recovery or free. Progress shows up on the character and on the map, and nothing resets, nothing decays and nothing turns red: a day off doesn't erase what's already done. For me, it became fun to use.

  I have used it on my PC since November 2026. The app was built for phone and PC from the start, which is why it had to work offline and keep both in sync. The phone is the next step.
rota:
  modo: loop
  titulo: The route of a change
  paradas:
    - titulo: You tap on your phone
      curto: Saved to IndexedDB, no waiting for the network.
      texto: >-
        The write goes straight to the device's IndexedDB. The UI never waits for the network, and the
        app works with the server turned off.
      midia:
        imagem: ../../../assets/projetos/life-rpg/agora.png
        moldura: celular
        alt: Life RPG Now screen, with one study quest in focus, Start and Finish buttons and another quest that also fits right now
    - titulo: Sync
      curto: Sends the cursor and the changes.
      texto: >-
        The device sends `POST /api/sync` with its cursor and local changes, and gets back everything
        that changed since that cursor.
    - titulo: Server
      curto: Last-write-wins and a global revision.
      texto: >-
        The Fastify API applies the changes with last-write-wins (the most recent `updatedAt` wins; on a
        tie, the version that reached the server first stays) and bumps the global revision in SQLite.
    - titulo: Notifying devices
      curto: Server-Sent Events.
      texto: When a new revision comes in, the server notifies the connected devices through Server-Sent Events, and each one fetches the changes.
    - titulo: Dashboard on the PC
      curto: Updates in near real time.
      texto: The Dashboard open on the second monitor updates in near real time.
      midia:
        imagem: ../../../assets/projetos/life-rpg/painel.png
        alt: Life RPG dashboard on the computer, with the current quest, the day's timeline, the focus timer and the capture form
funcionalidades:
  - titulo: Now
    texto: >-
      One quest at a time, the day's blocks, an optional timer and quick capture: type, then adjust with buttons.
    midia:
      imagem: ../../../assets/projetos/life-rpg/agora.png
      moldura: celular
      alt: Now screen, with one study quest in focus and Start and Finish buttons
  - titulo: Spaced repetition
    texto: Code, cloze, image and audio cards, scheduled with FSRS-6 and a daily time budget.
    midia:
      imagem: ../../../assets/projetos/life-rpg/revisao.png
      moldura: celular
      alt: 'Reviewing a card with the question "What is a foreign key?", the answer and four rating buttons: Missed, Hard, Good and Easy'
  - titulo: Character
    texto: >-
      XP for the estimated effort of each task, with a cap on focus time and no XP for just logging
      data, and attributes tied to real areas of life.
    midia:
      imagem: ../../../assets/projetos/life-rpg/personagem.png
      moldura: celular
      alt: Character sheet for the fictional character Lia, with level, XP, a shortcut to the world map and attributes by area of life
  - titulo: Journeys
    texto: A project becomes a journey of quests in order. Only the next one shows up on the Now screen, so the project never turns into a to-do list.
    midia:
      imagem: ../../../assets/projetos/life-rpg/jornada.png
      moldura: celular
      alt: An open journey with its quests in order, two done and three to go, with made-up data
arquitetura:
  titulo: Architecture
  texto: >-
    Everything is saved on the device first. The server is where devices meet and where backups live,
    not a requirement for using the app.
  nos:
    - { id: app, rotulo: React 19 PWA, detalhe: Zustand · service worker, col: 0, lin: 0, explicacao: "React screens with state in Zustand. The service worker makes the app installable and available offline." }
    - { id: idb, rotulo: IndexedDB, detalhe: Dexie 4, col: 1, lin: 0, explicacao: "Everything is saved on the device first. The UI never waits for the network." }
    - { id: api, rotulo: Fastify 5 API, detalhe: POST /api/sync, col: 2, lin: 0, explicacao: "Receives changes with the device's cursor and returns what changed since then. On conflict, the most recent updatedAt wins." }
    - { id: sqlite, rotulo: SQLite, detalhe: "node:sqlite", col: 3, lin: 0, destaque: true, explicacao: "Node 24's built-in database, with a global revision that only grows. If the database was restored from a backup and a device knows revisions it doesn't have, the device starts over and resends everything." }
    - { id: backup, rotulo: Daily backup, detalhe: media by SHA-256, col: 4, lin: 0, explicacao: "The database gets one copy a day, with the 14 most recent kept. Media is stored by its SHA-256 hash and lives in a mirror folder with hard links, which takes no extra space and is never deleted." }
    - { id: sse, rotulo: SSE, detalhe: /api/stream, col: 3, lin: 1, explicacao: "Notifies the connected devices when a new revision comes in, and each one fetches the changes." }
    - { id: painel, rotulo: Dashboard on PC, detalhe: live updates, col: 4, lin: 1, explicacao: "The Dashboard on the second monitor follows the phone in near real time." }
  faixas:
    - { de: app, para: idb }
    - { de: idb, para: api }
    - { de: api, para: sqlite }
    - { de: sqlite, para: backup }
    - { de: api, para: sse }
    - { de: sse, para: painel }
decisoes:
  - titulo: Truly offline-first
    resumo: >-
      The app saves everything on the device first, so it works offline and never waits for the network.
    escolha: Everything is saved to IndexedDB first, and syncing happens afterwards.
    porque: I want to use it on my phone anywhere, even without signal. The UI never waits for the network, and the app works with the server off.
    deixeiDeLado: An online-only app, simpler to write but useless without signal.
  - titulo: Cursor-based sync and last-write-wins
    resumo: >-
      Each device sends what it changed and receives what the others changed. If two edit the same thing, the most recent change wins.
    escolha: >-
      The server keeps a global revision. Each device sends its own changes and gets back what changed
      since its cursor. On conflict, the most recent `updatedAt` wins (on a tie, the one that arrived
      first stays). The exception is speech recordings, which are merged together.
    porque: >-
      For a single user with few real conflicts, last-write-wins is predictable and easy to test. If
      the server is restored from a backup and a device knows revisions it doesn't have, the device
      starts over and resends everything.
    deixeiDeLado: >-
      CRDTs, which would resolve simultaneous edits without loss, at a complexity that doesn't pay off
      for one person.
  - titulo: Pure domain rules
    resumo: >-
      The app's most important rules live in a package separate from the UI and the server, which makes each one easy to test.
    escolha: >-
      The day scheduler, XP, recurrence, spaced repetition (FSRS), routine analysis (planned vs. done, postponements and trends), the Portuguese parser and merging live in `packages/shared`, with no browser or server.
    porque: The most important rules become pure functions, easy to test and shared by both sides.
    deixeiDeLado: Logic spread across components, faster at first and a nightmare to test later.
  - titulo: Content-addressed media
    resumo: >-
      Images and audio are identified by their own content, so the same file is never stored twice, not even in backups.
    escolha: Images and audio are stored by their SHA-256 hash, and the daily backup mirrors media with hard links.
    porque: The same file is never stored twice. The database gets one copy a day, with the 14 most recent kept, and media lives in a mirror folder with hard links, which takes no extra space and is never deleted.
    deixeiDeLado: File names by id, where the same file could be stored twice and change after the backup.
  - titulo: Secure even though it's personal
    resumo: >-
      The server isn't exposed directly to the internet. Outside access is planned through a private network with HTTPS.
    escolha: >-
      A token compared in constant time and a server that only accepts connections from its own
      machine. Outside access is planned through Tailscale's private network, with HTTPS. The AI key
      lives only on the server.
    porque: It's a server with my personal data. Nothing is exposed directly to the internet.
    deixeiDeLado: Opening a port on the router, which would be simpler and much riskier.
  - titulo: Evidence before gamification
    resumo: >-
      Before deciding what earns points, I reviewed the app's main flows in light of research on habits and learning.
    escolha: >-
      I compared the app's rules with a research base of 63 sources on habits, learning and sleep, and reviewed the main flows in light of it. The result is in [this document](https://github.com/Vitor-Brosque/life-rpg/blob/main/docs/analise-pesquisa-cientifica-2026-11-13.md), which cites the sources by code.
    porque: >-
      Badly designed gamification rewards the wrong thing. That's why logging sleep gives no XP:
      rewarding the logging instead of the behavior can hurt motivation.
    deixeiDeLado: >-
      XP for everything, which feels motivating and creates the wrong incentive. XP, levels and the map
      are treated as personal taste, not as a proven technique.
hoje: It works offline, has more than 2,300 automated tests and is in use on the PC.
proximos:
  - "Turn on HTTPS access over the private network and test on a real iPhone: installing as a PWA, notifications, microphone, offline use and syncing with the PC."
  - Test the AI helpers with a real key.
  - Set up continuous integration (CI).
seo:
  descricao: >-
    Life RPG case study: an offline-first pixel-art PWA with cursor-based sync, SSE and pure domain
    rules in TypeScript.
